[package]
name = "omnyadesk-desktop"
version = "0.1.0"
edition = "2021"
description = "OmnyaDesk Windows operator"
build = "build.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json","rustls-tls"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
uuid = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
