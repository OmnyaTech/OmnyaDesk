name: Public source quality & secret guard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: omnya_ci
          # Disposable container accessible only inside this CI runner.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: omnyadesk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnya_ci -d omnyadesk_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Disposable CI-only user/database. Never put live credentials in YAML.
      DATABASE_URL: postgresql://omnya_ci@127.0.0.1:5432/omnyadesk_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan history with open-source Gitleaks (no paid license)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --log-opts='--all'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Scan committed public content
        run: node scripts/audit-public.mjs
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply versioned SQL migrations
        run: pnpm run db:migrate
      - name: Lint, typecheck, tests, build and smoke
        run: pnpm run check
      # Remote Docker/SSH suites are opt-in and require a dedicated runner.
      # No production SSH private key or live API token is supplied to CI.
